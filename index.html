<html lang="nl">
<head>

<meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">

<meta name="robots" content="noindex, nofollow">
<title>Badmatten</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232a78d6'/%3E%3Crect x='22' y='34' width='56' height='34' rx='8' fill='%23fff'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232a78d6'/%3E%3Crect x='22' y='34' width='56' height='34' rx='8' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme: light;
  --bg:#f4f4f1; --surface:#fcfcfb; --surface-2:#f0efec;
  --line:#e2e1dc; --line-strong:#cfcec8;
  --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#84837d;
  --blauw:#2a78d6; --groen:#1baf7a; --rood:#c8322f; --oranje:#a06400;
  --bar:#d9d8d3;
  --schaduw:0 1px 2px rgba(0,0,0,.05), 0 1px 8px rgba(0,0,0,.03);
}
@media (prefers-color-scheme: dark){
  :root:not([data-thema="licht"]){
    color-scheme: dark;
    --bg:#111110; --surface:#1a1a19; --surface-2:#232322;
    --line:#2f2f2d; --line-strong:#3f3f3c;
    --ink:#f5f5f0; --ink-2:#b3b2aa; --ink-3:#86857e;
    --blauw:#3987e5; --groen:#199e70; --rood:#e66767; --oranje:#e0a52a;
    --bar:#34342f; --schaduw:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:820px;margin:0 auto;padding:0 14px 48px}
h1,h2,h3{margin:0;font-weight:600}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

header{position:sticky;top:0;z-index:30;background:var(--bg);
  padding:calc(10px + env(safe-area-inset-top)) 14px 0;border-bottom:1px solid var(--line)}
header .binnen{max-width:820px;margin:0 auto}
.kop{display:flex;align-items:center;gap:10px;padding-bottom:8px}
.merk{display:flex;align-items:center;gap:9px;min-width:0}
.stip{width:22px;height:22px;border-radius:7px;background:var(--blauw);flex:0 0 auto;display:grid;place-items:center}
.stip::after{content:"";width:12px;height:7px;border-radius:2px;background:#fff}
.merk h1{font-size:16px;letter-spacing:-.01em}
.bijgewerkt{color:var(--ink-3);font-size:11.5px;margin-left:auto;text-align:right;line-height:1.25}

.rij{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rij::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);
  border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;
  color:var(--ink-3);font:inherit;font-size:14px;padding:9px 11px;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blauw);font-weight:550}
.subtabs{display:flex;gap:6px;margin:12px 0 2px;flex-wrap:wrap}
.subtabs button{background:var(--surface-2);border:1px solid transparent;color:var(--ink-2);
  border-radius:9px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.subtabs button[aria-selected="true"]{background:var(--surface);border-color:var(--line-strong);color:var(--ink);font-weight:550}

.periode-eigen{display:flex;gap:8px;align-items:center;margin:10px 0 0;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.periode-eigen input{padding:7px 9px;border-radius:9px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink);font:inherit;font-size:13px}
.bereik{font-size:11.5px;color:var(--ink-3);padding:2px 0 8px}

.kaart{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--schaduw);padding:14px;margin-top:12px}
.kaart h2{font-size:13px;color:var(--ink-2);font-weight:600;margin-bottom:10px}

.tegels{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tegel{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--schaduw);padding:12px 13px;min-width:0}
.tegel .label{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tegel .waarde{font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:3px;line-height:1.15}
.tegel .onder{font-size:12px;color:var(--ink-2);margin-top:2px}
.tegel.breed{grid-column:span 2}
.tegel.breed .waarde{font-size:30px}
.pos{color:var(--groen)} .neg{color:var(--rood)}

.lijst{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .titel{font-size:14px;font-weight:550}
.item .sub{font-size:12px;color:var(--ink-3);grid-column:1}
.item .rechts{text-align:right;font-size:14px;font-weight:550;white-space:nowrap}
.item .rechts small{display:block;font-weight:400;font-size:11.5px;color:var(--ink-3)}
.dagkop{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;
  padding:14px 0 4px;border-top:1px solid var(--line);margin-top:2px}
.dagkop:first-child{border-top:0;padding-top:2px;margin-top:0}
.vlag{display:inline-block;font-size:11px;color:var(--ink-2);background:var(--surface-2);
  border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.vlag.retour{color:var(--oranje)}

.tabelwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:7px 8px;white-space:nowrap;border-top:1px solid var(--line)}
th{color:var(--ink-3);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-top:0}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
tr.totaal td{font-weight:600;border-top:2px solid var(--line-strong)}
tr.sub td:first-child{padding-left:20px;color:var(--ink-2);font-weight:400}

.spoor{height:6px;border-radius:3px;background:var(--bar);overflow:hidden;margin-top:6px}
.vulling{height:100%;border-radius:3px;background:var(--ink-3)}
.staaf{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--bar);gap:2px;margin-top:8px}
.staaf i{display:block;height:100%}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:8px}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{width:10px;height:10px;border-radius:3px;display:inline-block}

.melding{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;font-size:12.5px;color:var(--ink-2);margin-top:12px}
.leeg{color:var(--ink-3);font-size:13.5px;padding:26px 0;text-align:center}
.zoek{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink);font:inherit;font-size:14px;margin-bottom:6px}

.slotscherm{max-width:340px;margin:16vh auto;padding:0 18px;text-align:center}
.slotscherm .stip{width:44px;height:44px;border-radius:13px;margin:0 auto 16px}
.slotscherm .stip::after{width:24px;height:13px;border-radius:3px}
.slotscherm h1{font-size:19px;margin-bottom:6px}
.slotscherm p{color:var(--ink-2);font-size:13.5px;margin:0 0 18px}
.slotscherm input{width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink);font:inherit;text-align:center}
.slotscherm button{width:100%;margin-top:10px;padding:12px;border-radius:11px;border:0;
  background:var(--ink);color:var(--surface);font:inherit;font-weight:600;cursor:pointer}
.fout{color:var(--rood);font-size:13px;margin-top:12px;min-height:18px}
.laden{text-align:center;color:var(--ink-3);padding:22vh 0;font-size:14px}
.spinner{width:26px;height:26px;border:2.5px solid var(--line-strong);border-top-color:var(--ink-3);
  border-radius:50%;margin:0 auto 14px;animation:draai .8s linear infinite}
@keyframes draai{to{transform:rotate(360deg)}}
.voet{color:var(--ink-3);font-size:11.5px;text-align:center;margin-top:26px;line-height:1.6}
</style>
</head>
<body>
<div id="app"><div class="laden"><div class="spinner"></div>Gegevens laden…</div></div>
<script>
"use strict";
const app = document.getElementById("app");
const OPSLAG = "badmatten-sleutel";
let D = null, tab = "home", subtab = "op-datum", zoekterm = "";
let preset = "deze-maand", van = "", tot = "";

/* ------------------------------------------------------------- opmaak */
const euro = n => (n < 0 ? "−" : "") + "€" +
  Math.abs(n || 0).toLocaleString("nl-BE", {minimumFractionDigits:2, maximumFractionDigits:2});
const getal = n => (n || 0).toLocaleString("nl-BE");
const MAANDEN = ["januari","februari","maart","april","mei","juni","juli",
                 "augustus","september","oktober","november","december"];
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const iso = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") +
                 "-" + String(d.getDate()).padStart(2,"0");
const datumKort = d => d ? (+d.slice(8) + " " + MAANDEN[+d.slice(5,7)-1].slice(0,3)) : "";
const datumLang = d => d ? (+d.slice(8) + " " + MAANDEN[+d.slice(5,7)-1] + " " + d.slice(0,4)) : "";
const komma = (n, cijfers) => (n || 0).toFixed(cijfers).replace(".", ",");

/* -------------------------------------------------------- ontsleutelen */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function ontsleutel(blok, ww){
  const basis = await crypto.subtle.importKey("raw", new TextEncoder().encode(ww),
    "PBKDF2", false, ["deriveKey"]);
  const sleutel = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(blok.zout), iterations:blok.rondes||200000, hash:"SHA-256"},
    basis, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  let plat = new Uint8Array(await crypto.subtle.decrypt(
    {name:"AES-GCM", iv:b64(blok.iv)}, sleutel, b64(blok.data)));
  if (blok.gz){
    if (typeof DecompressionStream === "undefined")
      throw new Error("Deze browser is te oud om het bestand uit te pakken.");
    const s = new Blob([plat]).stream().pipeThrough(new DecompressionStream("gzip"));
    plat = new Uint8Array(await new Response(s).arrayBuffer());
  }
  return JSON.parse(new TextDecoder().decode(plat));
}

/* --------------------------------------------------------------- start */
async function start(){
  let sleutel = "";
  const hash = location.hash.replace(/^#/, "");
  const m = /(?:^|&)s=([^&]+)/.exec(hash);
  if (m) sleutel = decodeURIComponent(m[1]);
  else if (hash && !hash.includes("=")) sleutel = decodeURIComponent(hash);
  if (sleutel){
    try { localStorage.setItem(OPSLAG, sleutel); } catch(e){}
    history.replaceState(null, "", location.pathname + location.search);
  } else {
    try { sleutel = localStorage.getItem(OPSLAG) || ""; } catch(e){}
  }
  if (!sleutel) return toonSlot("");
  let blok;
  try {
    const r = await fetch("data.json?t=" + Date.now(), {cache:"no-store"});
    if (!r.ok) throw new Error("status " + r.status);
    blok = await r.json();
  } catch(e){
    app.innerHTML = '<div class="wrap"><div class="melding">De gegevens konden niet ' +
      'geladen worden (' + esc(e.message) + '). Probeer het zo nog eens.</div></div>';
    return;
  }
  try { D = await ontsleutel(blok, sleutel); }
  catch(e){
    try { localStorage.removeItem(OPSLAG); } catch(_){}
    return toonSlot("Die code klopt niet.");
  }
  zetPreset("deze-maand");
  teken();
}

function toonSlot(fout){
  app.innerHTML = '<div class="slotscherm"><div class="stip"></div><h1>Badmatten</h1>' +
    '<p>Vul de code in die je gekregen hebt. Daarna onthoudt deze telefoon hem.</p>' +
    '<input id="code" type="password" autocomplete="current-password" placeholder="code" ' +
    'inputmode="text" autocapitalize="off" autocorrect="off">' +
    '<button id="open">Openen</button><div class="fout">' + esc(fout) + '</div></div>';
  const veld = document.getElementById("code");
  const gaan = () => {
    if (!veld.value.trim()) return;
    try { localStorage.setItem(OPSLAG, veld.value.trim()); } catch(e){}
    app.innerHTML = '<div class="laden"><div class="spinner"></div>Gegevens laden…</div>';
    start();
  };
  document.getElementById("open").onclick = gaan;
  veld.onkeydown = e => { if (e.key === "Enter") gaan(); };
  veld.focus();
}

/* ------------------------------------------------------------- periode */
const PRESETS = [
  ["vandaag","Vandaag"], ["gisteren","Gisteren"],
  ["deze-week","Deze week"], ["vorige-week","Vorige week"],
  ["deze-maand","Deze maand"], ["vorige-maand","Vorige maand"],
  ["dit-jaar","Dit jaar"], ["vorig-jaar","Vorig jaar"], ["aangepast","Aangepast"],
];

function zetPreset(naam){
  preset = naam;
  const nu = new Date(); nu.setHours(12,0,0,0);
  const dag = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
  // Maandag als eerste dag van de week.
  const maandag = d => dag(d, -((d.getDay() + 6) % 7));
  let a = nu, b = nu;
  if (naam === "vandaag"){ a = b = nu; }
  else if (naam === "gisteren"){ a = b = dag(nu, -1); }
  else if (naam === "deze-week"){ a = maandag(nu); b = nu; }
  else if (naam === "vorige-week"){ a = dag(maandag(nu), -7); b = dag(a, 6); }
  else if (naam === "deze-maand"){ a = new Date(nu.getFullYear(), nu.getMonth(), 1); b = nu; }
  else if (naam === "vorige-maand"){
    a = new Date(nu.getFullYear(), nu.getMonth()-1, 1);
    b = new Date(nu.getFullYear(), nu.getMonth(), 0);
  }
  else if (naam === "dit-jaar"){ a = new Date(nu.getFullYear(), 0, 1); b = nu; }
  else if (naam === "vorig-jaar"){
    a = new Date(nu.getFullYear()-1, 0, 1); b = new Date(nu.getFullYear()-1, 11, 31);
  }
  else if (naam === "aangepast"){ return; }
  van = iso(a); tot = iso(b);
}

const inBereik = d => { const x = (d || "").slice(0,10); return x && x >= van && x <= tot; };

// Aantal dagen van maand `maand` (YYYY-MM) dat binnen het bereik valt, plus het
// totaal aantal dagen van die maand. Zo kan een maandbedrag (opslag) eerlijk
// over een willekeurig bereik verdeeld worden.
function dagenIn(maand){
  const j = +maand.slice(0,4), m = +maand.slice(5,7);
  const eerste = new Date(j, m-1, 1, 12), laatste = new Date(j, m, 0, 12);
  const totaal = laatste.getDate();
  const a = new Date(+van.slice(0,4), +van.slice(5,7)-1, +van.slice(8), 12);
  const b = new Date(+tot.slice(0,4), +tot.slice(5,7)-1, +tot.slice(8), 12);
  const van_ = a > eerste ? a : eerste;
  const tot_ = b < laatste ? b : laatste;
  const overlap = Math.round((tot_ - van_) / 86400000) + 1;
  return [Math.max(0, Math.min(overlap, totaal)), totaal];
}

/* ------------------------------------------------------------ rekenen */
function producten(){ return D.producten || []; }
function prod(ean){ return producten().find(p => p.ean === ean) || {ean, naam: ean.slice(-4)}; }
function naamVan(ean){ return prod(ean).naam || ean; }

let _verkoopCache = null;
function verkoopmaanden(){
  // Alle maanden waarin er iets verkocht is, ongeacht het gekozen bereik.
  if (_verkoopCache) return _verkoopCache;
  const set = new Set();
  for (const r of Object.values((D.ruw || {}).orderregels || {}))
    if ((r.aantal || 0) - (r.geannuleerd || 0) > 0) set.add((r.dag || "").slice(0,7));
  set.delete("");
  _verkoopCache = set;
  return set;
}

let _opslagCache = null;
function opslagPerMaand(){
  // {maand: {ean: bedrag}} uit de facturen, plus een gemiddelde per artikel voor
  // maanden die bol nog niet gefactureerd heeft.
  if (_opslagCache) return _opslagCache;
  const per = {};
  for (const f of Object.values((D.ruw || {}).facturen || {})){
    for (const [k, v] of Object.entries(f.posten || {})){
      const i = k.lastIndexOf("|");
      const ean = k.slice(0, i), soort = k.slice(i+1);
      if (soort !== "STORAGE") continue;
      per[f.maand] = per[f.maand] || {};
      per[f.maand][ean] = (per[f.maand][ean] || 0) + Math.abs(v);
    }
  }
  const gem = {};
  const laatste = Object.keys(per).sort().slice(-3);
  for (const p of producten()){
    const rij = laatste.map(m => per[m][p.ean] || 0).filter(x => x);
    gem[p.ean] = rij.length ? rij.reduce((a,b) => a+b, 0) / rij.length : 0;
  }
  _opslagCache = {per, gem};
  return _opslagCache;
}

function leeg(){
  return {omzet_incl:0, omzet_excl:0, btw:0, stuks:0, commissie:0, inkoop:0,
          pickpack:0, opslag:0, ads:0, vertoningen:0, kliks:0,
          retour_aangemeld:0, retour_verwerkt:0, retour_verlies:0,
          kosten:0, winst:0, bestellingen:0};
}

function bereken(){
  const totaal = leeg(), perEan = {}, orders = {}, alleOrders = new Set();
  for (const p of producten()){ perEan[p.ean] = leeg(); orders[p.ean] = new Set(); }
  const tarief = ((D.tarieven || {}).pickpack_per_stuk) || 0;

  for (const r of Object.values((D.ruw || {}).orderregels || {})){
    if (!inBereik(r.dag)) continue;
    const k = perEan[r.ean]; if (!k) continue;
    const netto = (r.aantal || 0) - (r.geannuleerd || 0);
    if (netto <= 0) continue;
    const p = prod(r.ean), btw = +(p.btw || 21);
    const incl = (r.prijs || 0) * netto, excl = incl / (1 + btw/100);
    k.omzet_incl += incl; k.omzet_excl += excl; k.btw += incl - excl;
    k.stuks += netto;
    k.commissie += r.aantal ? (r.commissie || 0) * netto / r.aantal : 0;
    k.inkoop += (+(p.kostprijs || 0)) * netto;
    k.pickpack += tarief * netto;
    orders[r.ean].add(r.oid); alleOrders.add(r.oid);
  }

  for (const [sleutel, v] of Object.entries((D.ruw || {}).ads || {})){
    const i = sleutel.indexOf("|");
    const dag = sleutel.slice(0, i), ean = sleutel.slice(i+1);
    if (!inBereik(dag) || !perEan[ean]) continue;
    const rij = Array.isArray(v) ? v : [v, 0, 0];
    perEan[ean].ads += rij[0] || 0;
    perEan[ean].vertoningen += rij[1] || 0;
    perEan[ean].kliks += rij[2] || 0;
  }

  // Opslag hangt aan voorraad en niet aan verkoop: het maandbedrag wordt over
  // de dagen verdeeld die in het gekozen bereik vallen.
  const {per, gem} = opslagPerMaand();
  const verkocht = verkoopmaanden();
  const dezeMaand = iso(new Date()).slice(0,7);
  const maanden = new Set([...Object.keys(per), ...verkocht, dezeMaand]);
  for (const maand of maanden){
    const [dagen, totaalDagen] = dagenIn(maand);
    if (!dagen) continue;
    const gefactureerd = per[maand];
    // RAAM NOOIT OPSLAG VOOR EEN MAAND WAARIN NIETS GEBEURDE.
    //
    // Zonder deze grens kreeg elke maand in het bereik het gemiddelde
    // opslagbedrag toegerekend: "vorig jaar" kwam daardoor uit op 548 euro
    // verlies terwijl er in 2025 nog geen mat verkocht was.
    if (!gefactureerd && !verkocht.has(maand) && maand !== dezeMaand) continue;
    for (const p of producten()){
      const bedrag = gefactureerd ? gefactureerd[p.ean] : null;
      const perMaand = bedrag != null ? bedrag : (gefactureerd ? 0 : gem[p.ean]);
      perEan[p.ean].opslag += (perMaand || 0) * dagen / totaalDagen;
    }
  }

  for (const r of (D.retours || [])){
    const k = perEan[r.ean]; if (!k) continue;
    if (inBereik(r.aangemeld)) k.retour_aangemeld += r.aantal || 0;
    if (inBereik(r.verwerkt)){
      k.retour_verwerkt += r.aantal || 0;
      k.retour_verlies += r.verlies || 0;
    }
  }

  for (const p of producten()){
    const k = perEan[p.ean];
    k.bestellingen = orders[p.ean].size;
    k.kosten = k.commissie + k.inkoop + k.pickpack + k.opslag + k.ads + k.retour_verlies;
    k.winst = k.omzet_excl - k.kosten;
    k.marge = k.omzet_excl ? 100 * k.winst / k.omzet_excl : 0;
    k.acos = k.omzet_excl ? 100 * k.ads / k.omzet_excl : 0;
    for (const veld of Object.keys(totaal))
      if (veld !== "bestellingen") totaal[veld] += k[veld];
  }
  totaal.bestellingen = alleOrders.size;
  totaal.marge = totaal.omzet_excl ? 100 * totaal.winst / totaal.omzet_excl : 0;
  totaal.acos = totaal.omzet_excl ? 100 * totaal.ads / totaal.omzet_excl : 0;
  return {totaal, perEan};
}

/* ------------------------------------------------------------- tekenen */
const TABS = [["home","Home"], ["bestellingen","Bestellingen"],
              ["voorraad","Voorraad"], ["ads","Ads"], ["kosten","Kosten & omzet"]];

function teken(){
  app.innerHTML =
    '<header><div class="binnen">' +
      '<div class="kop"><div class="merk"><div class="stip"></div><h1>Badmatten</h1></div>' +
      '<div class="bijgewerkt">bijgewerkt<br>' + esc(bijgewerktTekst()) + '</div></div>' +
      '<div class="rij" id="presets"></div>' +
      '<nav class="tabs" id="tabs"></nav>' +
    '</div></header>' +
    '<div class="wrap"><div id="eigen"></div><div class="bereik" id="bereik"></div>' +
    '<div id="inhoud"></div>' +
    '<div class="voet">Alleen de vier badmatten. Cijfers komen rechtstreeks van bol.<br>' +
    'Meelezen kan, aanpassen niet.</div></div>';
  tekenPresets(); tekenTabs(); tekenInhoud();
}

function bijgewerktTekst(){
  if (!D.bijgewerkt) return "onbekend";
  const d = new Date(D.bijgewerkt);
  const min = Math.round((Date.now() - d.getTime()) / 60000);
  if (min < 2) return "zojuist";
  if (min < 60) return min + " min geleden";
  const uur = Math.round(min / 60);
  if (uur < 24) return uur + " uur geleden";
  return d.toLocaleDateString("nl-BE", {day:"numeric", month:"short"});
}

function tekenPresets(){
  document.getElementById("presets").innerHTML = PRESETS.map(([id, naam]) =>
    '<button class="chip" data-p="' + id + '" aria-pressed="' + (preset === id) + '">' +
    naam + '</button>').join("");
  document.querySelectorAll("#presets button").forEach(b => b.onclick = () => {
    zetPreset(b.dataset.p);
    tekenPresets(); tekenInhoud();
  });
  tekenEigen();
}

function tekenEigen(){
  const el = document.getElementById("eigen");
  el.innerHTML = preset !== "aangepast" ? "" :
    '<div class="periode-eigen"><label>van <input type="date" id="dvan" value="' + van + '"></label>' +
    '<label>tot <input type="date" id="dtot" value="' + tot + '"></label></div>';
  if (preset === "aangepast"){
    const dv = document.getElementById("dvan"), dt = document.getElementById("dtot");
    const wijzig = () => {
      van = dv.value || van; tot = dt.value || tot;
      if (van > tot){ const h = van; van = tot; tot = h; dv.value = van; dt.value = tot; }
      tekenBereik(); tekenInhoud();
    };
    dv.onchange = wijzig; dt.onchange = wijzig;
  }
  tekenBereik();
}

function tekenBereik(){
  const el = document.getElementById("bereik");
  if (el) el.textContent = van === tot ? datumLang(van)
    : datumLang(van) + " t/m " + datumLang(tot);
}

function tekenTabs(){
  document.getElementById("tabs").innerHTML = TABS.map(([id, naam]) =>
    '<button data-t="' + id + '" aria-selected="' + (tab === id) + '">' + naam + '</button>').join("");
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
    tab = b.dataset.t; zoekterm = "";
    if (tab === "bestellingen") subtab = "op-datum";
    tekenTabs(); tekenInhoud(); window.scrollTo({top:0});
  });
}

function tekenInhoud(){
  document.getElementById("inhoud").innerHTML =
    ({home:vHome, bestellingen:vBestellingen, voorraad:vVoorraad,
      ads:vAds, kosten:vKosten})[tab]();
  document.querySelectorAll(".subtabs button").forEach(b => b.onclick = () => {
    subtab = b.dataset.s; zoekterm = ""; tekenInhoud();
  });
  const z = document.getElementById("zoek");
  if (z) z.oninput = () => {
    zoekterm = z.value.toLowerCase();
    const doel = document.getElementById("bestellijst");
    if (doel) doel.innerHTML = bestellijst();
  };
}

/* ---------------------------------------------------------------- home */
function vHome(){
  const {totaal:t} = bereken();
  const tegel = (label, waarde, onder, klasse) =>
    '<div class="tegel"><div class="label">' + label + '</div>' +
    '<div class="waarde num ' + (klasse || "") + '">' + waarde + '</div>' +
    '<div class="onder">' + onder + '</div></div>';

  return '<div class="tegels">' +
    tegel("Bestellingen", getal(t.bestellingen),
          t.bestellingen ? euro(t.omzet_incl / t.bestellingen) + " gemiddeld" : "—") +
    tegel("Verkochte stuks", getal(t.stuks),
          t.bestellingen ? komma(t.stuks / t.bestellingen, 2) + " per bestelling" : "—") +
    tegel("Advertenties", euro(t.ads),
          t.omzet_excl ? komma(t.acos, 1) + "% van de omzet" : "—") +
    tegel("Omzet excl. btw", euro(t.omzet_excl), euro(t.omzet_incl) + " incl. btw") +
    tegel("Retouren", getal(t.retour_aangemeld),
          t.stuks ? komma(100 * t.retour_aangemeld / t.stuks, 1) + "% van de verkopen"
                  : "aangemeld in deze periode") +
    tegel("Retouren verwerkt", getal(t.retour_verwerkt),
          t.retour_verlies ? euro(t.retour_verlies) + " verlies" : "afgehandeld door bol") +
    tegel("Winst (na alles)", euro(t.winst),
          t.omzet_excl ? komma(t.marge, 1) + "% marge" : "geen omzet in deze periode",
          t.winst >= 0 ? "pos" : "neg") +
    tegel("Totale kosten", euro(t.kosten),
          t.omzet_excl ? komma(100 * t.kosten / t.omzet_excl, 0) + "% van de omzet" : "—") +
    '</div>' + meldingen();
}

function meldingen(){
  let html = "";
  const inPeriode = m => m >= van.slice(0,7) && m <= tot.slice(0,7);
  const geschat = ((D.tarieven || {}).geschatte_maanden || []).filter(inPeriode);
  if (geschat.length)
    html += '<div class="melding"><strong>Nog niet gefactureerd.</strong> Bol rekent ' +
      'fulfilment en opslag pas na afloop van de maand af. Voor ' +
      geschat.map(m => MAANDEN[+m.slice(5,7)-1]).join(" en ") +
      ' staan die op het tarief van de laatste afgerekende maanden, dus de winst ' +
      'kan nog een beetje schuiven.</div>';
  const onvolledig = ((D.tarieven || {}).onvolledige_maanden || []).filter(inPeriode);
  if (onvolledig.length)
    html += '<div class="melding"><strong>Deels bekend.</strong> Van ' +
      onvolledig.map(m => MAANDEN[+m.slice(5,7)-1]).join(", ") + ' heeft bol méér ' +
      'stuks gefactureerd dan er bestellingen van bekend zijn — bol geeft ' +
      'bestellingen ouder dan drie maanden niet meer terug. Die maand is dus een ' +
      'ondergrens.</div>';
  if ((D.fouten || []).length)
    html += '<div class="melding">Bij het laatste ophalen ging iets mis: ' +
      esc(D.fouten.join(" · ")) + '. De rest van de cijfers klopt gewoon.</div>';
  return html;
}

/* -------------------------------------------------------- bestellingen */
function vBestellingen(){
  const knop = (id, naam) => '<button data-s="' + id + '" aria-selected="' +
    (subtab === id) + '">' + naam + '</button>';
  let html = '<div class="subtabs">' + knop("op-datum","Op datum") +
    knop("gegroepeerd","Gegroepeerd") + knop("retours","Retours") + '</div>';
  if (subtab === "op-datum")
    html += '<div class="kaart"><input class="zoek" id="zoek" type="search" ' +
      'placeholder="Zoek op bestelnummer, kleur of land" autocapitalize="off">' +
      '<div class="lijst" id="bestellijst">' + bestellijst() + '</div></div>';
  else if (subtab === "gegroepeerd") html += gegroepeerd();
  else html += retourlijst();
  return html;
}

function bestellingenInBereik(){
  const per = {};
  for (const r of Object.values((D.ruw || {}).orderregels || {})){
    if (!inBereik(r.dag)) continue;
    const netto = (r.aantal || 0) - (r.geannuleerd || 0);
    if (netto <= 0) continue;
    const o = per[r.oid] = per[r.oid] ||
      {id:r.oid, dag:r.dag, tijd:(r.tijd || "").slice(11,16), land:r.land || "",
       regels:[], bedrag:0, stuks:0};
    o.regels.push({ean:r.ean, aantal:netto, prijs:r.prijs || 0});
    o.bedrag += (r.prijs || 0) * netto; o.stuks += netto;
    if (!o.tijd && r.tijd) o.tijd = r.tijd.slice(11,16);
    if (!o.land && r.land) o.land = r.land;
  }
  const retourOrders = new Set((D.retours || []).map(r => r.oid).filter(Boolean));
  const lijst = Object.values(per);
  for (const o of lijst) o.retour = retourOrders.has(o.id);
  lijst.sort((a,b) => (b.dag + b.tijd).localeCompare(a.dag + a.tijd));
  return lijst;
}

function bestellijst(){
  let rijen = bestellingenInBereik();
  if (zoekterm)
    rijen = rijen.filter(o => (o.id || "").toLowerCase().includes(zoekterm) ||
      (o.land || "").toLowerCase().includes(zoekterm) ||
      o.regels.some(r => naamVan(r.ean).toLowerCase().includes(zoekterm) ||
                         r.ean.includes(zoekterm)));
  if (!rijen.length) return '<div class="leeg">Geen bestellingen in deze periode.</div>';
  let html = "", vorigeDag = "";
  for (const o of rijen.slice(0, 500)){
    if (o.dag !== vorigeDag){
      vorigeDag = o.dag;
      html += '<div class="dagkop">' + esc(datumLang(o.dag)) + '</div>';
    }
    html += '<div class="item"><div class="titel">' +
      o.regels.map(r => (r.aantal > 1 ? r.aantal + "× " : "") + esc(naamVan(r.ean))).join(", ") +
      (o.retour ? '<span class="vlag retour">retour</span>' : "") + '</div>' +
      '<div class="rechts num">' + euro(o.bedrag) + '<small>' + esc(o.land) + '</small></div>' +
      '<div class="sub num">' + esc(o.tijd) + ' · ' + esc(o.id) + '</div></div>';
  }
  if (rijen.length > 500)
    html += '<div class="leeg">… en nog ' + (rijen.length - 500) + ' bestellingen.</div>';
  return html;
}

function gegroepeerd(){
  const {totaal, perEan} = bereken();
  const rijen = producten().map(p => ({p, k: perEan[p.ean]}))
    .sort((a,b) => b.k.omzet_excl - a.k.omzet_excl);
  if (!totaal.stuks) return '<div class="leeg">Geen bestellingen in deze periode.</div>';
  const max = Math.max(1, ...rijen.map(r => r.k.omzet_excl));
  let html = '<div class="kaart"><h2>Per badmat in deze periode</h2>';
  for (const {p, k} of rijen){
    html += '<div style="padding:10px 0;border-top:1px solid var(--line)">' +
      '<div style="display:flex;justify-content:space-between;gap:10px">' +
      '<strong>' + esc(p.naam) + '</strong>' +
      '<span class="num">' + euro(k.omzet_excl) + '</span></div>' +
      '<div class="spoor"><div class="vulling" style="background:var(--blauw);width:' +
      (100 * k.omzet_excl / max).toFixed(1) + '%"></div></div>' +
      '<div style="font-size:12px;color:var(--ink-3);margin-top:5px" class="num">' +
      getal(k.bestellingen) + ' bestellingen · ' + getal(k.stuks) + ' stuks' +
      (k.stuks ? ' · ' + euro(k.omzet_incl / k.stuks) + ' per mat' : '') +
      (k.retour_aangemeld ? ' · ' + getal(k.retour_aangemeld) + ' retour' : '') +
      '</div></div>';
  }
  html += '<div style="padding:10px 0 0;border-top:2px solid var(--line-strong);' +
    'display:flex;justify-content:space-between"><strong>Samen</strong>' +
    '<strong class="num">' + euro(totaal.omzet_excl) + '</strong></div>';
  return html + '</div>';
}

function retourlijst(){
  const rijen = (D.retours || []).filter(r => inBereik(r.aangemeld) || inBereik(r.verwerkt))
    .sort((a,b) => (b.aangemeld || "").localeCompare(a.aangemeld || ""));
  if (!rijen.length) return '<div class="leeg">Geen retours in deze periode. Mooi.</div>';
  return '<div class="kaart"><div class="lijst">' + rijen.map(r => {
    const status = !r.afgehandeld ? "onderweg"
      : (r.resultaat === "ACCEPTED" || !r.resultaat) ? "verwerkt"
      : r.resultaat.toLowerCase();
    return '<div class="item"><div class="titel">' + esc(naamVan(r.ean)) +
      (r.aantal > 1 ? " ×" + r.aantal : "") +
      '<span class="vlag">' + esc(status) + '</span></div>' +
      '<div class="rechts num">' + (r.verlies ? "−" + euro(r.verlies) : "—") + '</div>' +
      '<div class="sub">' + esc(datumKort(r.aangemeld)) +
      (r.verwerkt ? ' · verwerkt ' + esc(datumKort(r.verwerkt)) : '') + ' · ' +
      esc(r.reden || "geen reden opgegeven") +
      (r.toelichting ? ' — “' + esc(r.toelichting) + '”' : "") + '</div></div>';
  }).join("") + '</div></div>';
}

/* ------------------------------------------------------------ voorraad */
function vVoorraad(){
  const rijen = D.voorraad || [];
  if (!rijen.length) return '<div class="leeg">Nog geen voorraadgegevens.</div>';
  const kleuren = ["var(--blauw)", "var(--groen)", "var(--ink-3)"];
  let html = rijen.map(v => {
    const delen = [["bij bol", v.bol], ["fulfilment", v.fulfilment], ["thuis", v.thuis]];
    const totaal = Math.max(v.totaal, 1);
    return '<div class="kaart">' +
      '<div style="display:flex;justify-content:space-between;gap:10px">' +
      '<strong>' + esc(naamVan(v.ean)) + '</strong>' +
      '<strong class="num">' + getal(v.totaal) + ' stuks</strong></div>' +
      '<div class="staaf">' + delen.map(([, n], i) => n ?
        '<i style="width:' + (100*n/totaal).toFixed(1) + '%;background:' + kleuren[i] + '"></i>' : ""
      ).join("") + '</div>' +
      '<div class="legenda">' + delen.map(([naam, n], i) =>
        '<span><i style="background:' + kleuren[i] + '"></i>' + naam +
        ' <strong class="num">' + getal(n) + '</strong></span>').join("") +
      (v.graded ? '<span>· ' + getal(v.graded) + ' met schade</span>' : "") + '</div>' +
      '<div style="font-size:12px;color:var(--ink-3);margin-top:8px">' +
        (v.per_dag ? 'Gemiddeld ' + String(v.per_dag).replace(".", ",") +
          ' per dag verkocht' +
          (v.dagen != null ? ' · voorraad bij bol nog ~' + v.dagen + ' dagen' : '') +
          (v.dagen_totaal != null && v.dagen_totaal !== v.dagen ?
            ' · met alles erbij ~' + v.dagen_totaal + ' dagen' : '') + '.'
          : 'Nog geen verkopen in de laatste vier weken.') + '</div></div>';
  }).join("");
  const gemeten = rijen.map(v => v.gemeten).filter(Boolean).sort().pop();
  if (gemeten) html += '<div class="melding">Voorraad bij bol gemeten op ' +
    esc(datumKort(gemeten)) + '. Dit is de stand van nu, niet van de gekozen periode. ' +
    'Fulfilment en thuis worden door Olivier bijgehouden.</div>';
  return html;
}

/* ----------------------------------------------------------------- ads */
function vAds(){
  const {totaal, perEan} = bereken();
  if (!totaal.ads) return '<div class="kaart"><h2>Advertenties</h2>' +
    '<div class="leeg">Geen advertentiekosten in deze periode.</div></div>';
  const rijen = producten().map(p => ({p, k: perEan[p.ean]}))
    .sort((a,b) => b.k.ads - a.k.ads);
  const max = Math.max(1, ...rijen.map(r => r.k.ads));
  let html = '<div class="kaart"><h2>Advertentiekosten per badmat</h2>';
  for (const {p, k} of rijen){
    html += '<div style="padding:10px 0;border-top:1px solid var(--line)">' +
      '<div style="display:flex;justify-content:space-between;gap:10px">' +
      '<strong>' + esc(p.naam) + '</strong><span class="num">' + euro(k.ads) + '</span></div>' +
      '<div class="spoor"><div class="vulling" style="width:' +
      (100*k.ads/max).toFixed(1) + '%"></div></div>' +
      '<div style="font-size:12px;color:var(--ink-3);margin-top:5px" class="num">' +
      getal(k.vertoningen) + ' vertoningen · ' + getal(k.kliks) + ' kliks' +
      (k.vertoningen ? ' · ' + komma(100*k.kliks/k.vertoningen, 2) + '% ctr' : '') +
      (k.omzet_excl ? ' · ' + komma(k.acos, 0) + '% van de omzet' : '') +
      (k.stuks ? ' · ' + euro(k.ads / k.stuks) + ' per verkochte mat' : '') +
      '</div></div>';
  }
  html += '<div style="padding:10px 0 0;border-top:2px solid var(--line-strong);' +
    'display:flex;justify-content:space-between"><strong>Samen</strong>' +
    '<strong class="num">' + euro(totaal.ads) + '</strong></div></div>';
  html += '<div class="melding">Alleen de kosten die bol aan deze vier artikelen ' +
    'toewijst. Merkcampagnes die aan de hele winkel hangen tellen hier niet mee, ' +
    'want die zijn niet aan één artikel toe te rekenen.</div>';
  return html;
}

/* ---------------------------------------------------- kosten en omzet */
function vKosten(){
  const {totaal:t, perEan} = bereken();
  const rijen = producten().map(p => ({p, k: perEan[p.ean]}))
    .sort((a,b) => b.k.omzet_excl - a.k.omzet_excl);
  const pct = v => t.omzet_excl ? komma(100*v/t.omzet_excl, 1) + "%" : "—";
  const posten = [
    ["Commissie bol", "commissie"], ["Inkoop matten", "inkoop"],
    ["Fulfilment (pick & pack)", "pickpack"], ["Opslag bij bol", "opslag"],
    ["Advertenties", "ads"], ["Verlies op retours", "retour_verlies"],
  ];

  let html = '<div class="kaart"><h2>Van omzet naar winst</h2><div class="tabelwrap"><table>' +
    '<thead><tr><th>Post</th><th>Bedrag</th><th>Deel</th></tr></thead><tbody>' +
    '<tr><td>Omzet incl. btw</td><td class="num">' + euro(t.omzet_incl) +
    '</td><td class="num">—</td></tr>' +
    '<tr class="sub"><td>waarvan btw</td><td class="num">−' + euro(t.btw) +
    '</td><td class="num">—</td></tr>' +
    '<tr><td><strong>Omzet excl. btw</strong></td><td class="num"><strong>' +
    euro(t.omzet_excl) + '</strong></td><td class="num">100%</td></tr>';
  for (const [naam, veld] of posten)
    html += '<tr><td>' + naam + '</td><td class="num">−' + euro(t[veld]) +
      '</td><td class="num">' + pct(t[veld]) + '</td></tr>';
  html += '<tr class="totaal"><td>Totale kosten</td><td class="num">−' + euro(t.kosten) +
    '</td><td class="num">' + pct(t.kosten) + '</td></tr>' +
    '<tr class="totaal"><td>Winst na alles</td><td class="num ' +
    (t.winst >= 0 ? "pos" : "neg") + '">' + euro(t.winst) + '</td><td class="num">' +
    komma(t.marge, 1) + '%</td></tr></tbody></table></div></div>';

  html += '<div class="kaart"><h2>Per badmat</h2><div class="tabelwrap"><table>' +
    '<thead><tr><th>Badmat</th><th>Stuks</th><th>Omzet</th><th>Commissie</th><th>Inkoop</th>' +
    '<th>Fulfilment</th><th>Opslag</th><th>Ads</th><th>Retour</th><th>Kosten</th>' +
    '<th>Winst</th><th>Marge</th></tr></thead><tbody>';
  const cel = v => '<td class="num">' + euro(v) + '</td>';
  for (const {p, k} of rijen)
    html += '<tr><td>' + esc(p.naam) + '</td><td class="num">' + getal(k.stuks) + '</td>' +
      cel(k.omzet_excl) + cel(k.commissie) + cel(k.inkoop) + cel(k.pickpack) +
      cel(k.opslag) + cel(k.ads) + cel(k.retour_verlies) + cel(k.kosten) +
      '<td class="num ' + (k.winst >= 0 ? "pos" : "neg") + '">' + euro(k.winst) + '</td>' +
      '<td class="num">' + komma(k.marge, 0) + '%</td></tr>';
  html += '<tr class="totaal"><td>Samen</td><td class="num">' + getal(t.stuks) + '</td>' +
    cel(t.omzet_excl) + cel(t.commissie) + cel(t.inkoop) + cel(t.pickpack) +
    cel(t.opslag) + cel(t.ads) + cel(t.retour_verlies) + cel(t.kosten) +
    '<td class="num ' + (t.winst >= 0 ? "pos" : "neg") + '">' + euro(t.winst) + '</td>' +
    '<td class="num">' + komma(t.marge, 0) + '%</td></tr></tbody></table></div></div>';

  html += '<div class="melding"><strong>Hoe dit gerekend is.</strong> Omzet, stuks en ' +
    'commissie komen uit de bestellingen zelf. Fulfilment is het tarief per stuk uit de ' +
    'bolfacturen. Opslag komt van de maandfactuur en wordt over de dagen van de gekozen ' +
    'periode verdeeld. Advertenties komen uit het dagrapport van bol, per artikel. Inkoop ' +
    'is de kostprijs maal het aantal verkochte stuks. Een verwerkte retour draait omzet en ' +
    'commissie terug; de mat komt terug op voorraad tenzij bol hem als verloren ' +
    'afmeldt.</div>';
  return html + meldingen();
}

start();
